ndra Bank, HDFC Bank, ICICI Bank, YES Bank, and ESAF Small Finance Bank.","My advisory practice bridges corporate financial strategy with institutional credit requirements. I specialize in high-value Debt Syndications, bankable Techno-Economic Viability (TEV) Studies, Business Valuations under regulatory frameworks, NCLT and IBC Stressed Asset Resolutions, and Financial Audits.","Having managed multi-hundred crore balance sheets (including a ₹500+ Cr branch in Surat ranked #1 PAN India in Fee Revenue) and led sales teams of over 140 professionals in Mumbai, I provide direct, battle-tested principal advisory to CFOs, corporate promoters, and institutional investors."],executiveStory:{title:"Strategic Financial Solutions Built on Institutional Rigor",quote:"Capital is easy to promise, but bankable debt syndication requires aligning project reality with institutional risk frameworks.",paragraphs:["Over two decades in Indian banking taught me that most transaction failures stem from a breakdown in communication between corporate promoters and institutional credit committees. Promoters focus on commercial potential, while lenders require empirical sensitivity modeling and regulatory compliance.","I established my independent advisory practice to solve this disconnect. Whether securing project finance for an infrastructure enterprise or formulating an out-of-court restructuring plan under RBI guidelines, I manage the mandate directly from initial diagnostic to final execution."]},contact:{email:"sharmavn2001@yahoo.com",phone:"+91-9724305602",location:"Vadodara / Ahmedabad, Gujarat, India",linkedin:"https://www.linkedin.com/in/vishwanath-sharma-corporate-finance"},academics:[{degree:"MBA (Finance & Marketing)",institution:"Rajasthan University, Jaipur",year:"1996 - 1998"},{degree:"B.Sc (Bachelor of Science)",institution:"M. D. S. University",year:"1993 - 1996"}],certifications:["Leadership, Portfolio Management & Project Management","Train the Trainer - Executive Soft Skil
